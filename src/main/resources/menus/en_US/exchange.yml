config-version: 2
title: '&8&lItem Exchange %page_display%'
shape:
- '####I####'
- '#AAAAAAA#'
- '#AAAAAAA#'
- '#AAAAAAA#'
- '#AAAAAAA#'
- 'N#Q#K###P'
items:
  '#':
    type: BLACK_STAINED_GLASS_PANE
    name: ' '
  A:
    name: '&a%item_name%'
    lore:
    - '&6▶ &8Item Info'
    - '&a▸&7Name: %item_name%'
    - '&a▸&7ID: %item_id%'
    - '&a▸&7EMC value: %emc%'
    - ''
    - '&6▶ &8Actions'
    - '&7•&aLeft-click&a➤&fBuy 1'
    - '&7•&eRight-click&a➤&fBuy 64'
    triggers:
      left:
      - 'sound: ENTITY_EXPERIENCE_ORB_PICKUP-1-1'
      - 'exchange_buy_1'
      right:
      - 'sound: ENTITY_EXPERIENCE_ORB_PICKUP-1-1'
      - 'exchange_buy_64'
  I:
    type: NETHER_STAR
    name: '&e&lBalance Info'
    lore:
    - '&6▶ &8Account'
    - '&a▸&7Balance: %balance% EMC'
  K:
    type: ARROW
    name: '&c&lBack'
    lore:
    - '&7•&cLeft-click&a➤&fBack to main menu'
    triggers:
      left:
      - 'sound: UI_BUTTON_CLICK-1-1'
      - 'back'
  N:
    type: SPECTRAL_ARROW
    name: '&aPrevious Page (%current_page%/%total_pages%)'
    lore:
    - '&7•&aLeft-click&a➤&fGo to previous page'
    triggers:
      left:
      - 'sound: UI_BUTTON_CLICK-1-1'
      - 'prev_page'
  Q:
    type: COMPASS
    name: '&aSearch'
    lore:
    - '&6▶ &8Search Info'
    - '&a▸&7Current search: %current_search%'
    - ''
    - '&6▶ &8Actions'
    - '&7•&aLeft-click&a➤&fSearch'
    - '&7•&eRight-click&a➤&fClear search'
    triggers:
      left:
      - 'sound: BLOCK_NOTE_BLOCK_PLING-1-2'
      - 'search'
      right:
      - 'sound: BLOCK_NOTE_BLOCK_PLING-1-2'
      - 'clear_search'
  P:
    type: SPECTRAL_ARROW
    name: '&aNext Page (%current_page%/%total_pages%)'
    lore:
    - '&7•&aLeft-click&a➤&fGo to next page'
    triggers:
      left:
      - 'sound: UI_BUTTON_CLICK-1-1'
      - 'next_page'

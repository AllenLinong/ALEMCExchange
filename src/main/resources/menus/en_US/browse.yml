config-version: 2
title: '&8&lItem Browser %page_display%'
shape:
- '####T####'
- '#AAAAAAA#'
- '#AAAAAAA#'
- '#AAAAAAA#'
- '#AAAAAAA#'
- 'N#Q#K###P'
items:
  '#':
    type: BLACK_STAINED_GLASS_PANE
    name: ' '
  A:
    name: '&e%item_name%'
    lore:
    - '&6▶ &8Item Info'
    - '&a▸&7EMC value: %emc%'
    - ''
    - '&6▶ &8Unlock Progress'
    - '&a▸&7Mined: %mine_progress%'
    - '&a▸&7Sold: %sell_progress%'
    - '&a▸&7Status: %unlock_status%'
  K:
    type: ARROW
    name: '&c&lBack'
    lore:
    - '&7•&cLeft-click&a➤&fBack to main menu'
    triggers:
      left:
      - 'sound: UI_BUTTON_CLICK-1-1'
      - 'back'
  N:
    type: SPECTRAL_ARROW
    name: '&aPrevious Page (%current_page%/%total_pages%)'
    lore:
    - '&7•&aLeft-click&a➤&fGo to previous page'
    triggers:
      left:
      - 'sound: UI_BUTTON_CLICK-1-1'
      - 'prev_page'
  Q:
    type: COMPASS
    name: '&aSearch'
    lore:
    - '&6▶ &8Search Info'
    - '&a▸&7Current search: %current_search%'
    - ''
    - '&6▶ &8Actions'
    - '&7•&aLeft-click&a➤&fSearch'
    - '&7•&eRight-click&a➤&fClear search'
    triggers:
      left:
      - 'sound: BLOCK_NOTE_BLOCK_PLING-1-2'
      - 'search'
      right:
      - 'sound: BLOCK_NOTE_BLOCK_PLING-1-2'
      - 'clear_search'
  T:
    type: PAPER
    name: '&ePage %current_page% of %total_pages%'
    lore:
    - '&6▶ &8Stats'
    - '&a▸&7Total items: %total_items%'
  P:
    type: SPECTRAL_ARROW
    name: '&aNext Page (%current_page%/%total_pages%)'
    lore:
    - '&7•&aLeft-click&a➤&fGo to next page'
    triggers:
      left:
      - 'sound: UI_BUTTON_CLICK-1-1'
      - 'next_page'

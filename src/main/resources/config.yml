# 数据库与跨服同步配置见 database.yml
# ── 语言设置 ──
# language: 服务器语言，决定加载 menus/<语言>/ 菜单目录与 lang/<语言>.yml 消息文件
# 切换语言：改成 en_US 后执行 /alex reload（菜单文件按语言目录整体加载）
language: zh_CN

# 菜单按钮全局冷却（秒）：同一玩家任意按钮 CD 内只响应一次，防连点器
# 人类点击峰值约 5-8 次/秒，0.25 秒对真人无感、连点器全挡
# 想更严格可调 0.25 或 0.5；0 = 关闭
gui:
  button-click-cooldown-seconds: 0.15

# 调试功能
debug:
  # 是否开启调试模式
  enabled: false
  # 调试级别：info, debug, trace
  level: info

# 默认税率 5%
sell_tax: 0.05

# 不同权限的税率配置
tax_rates:
  # VIP 3% 税率
  alemcexchange.vip: 0.03
  # 高级用户 1% 税率
  alemcexchange.premium: 0.01
  # 无税率
  alemcexchange.notax: 0.0

# 功能开关
features:
  # 背包放不下时：true = 兑换物品掉落在脚边；false = 拒绝兑换
  drop_overflow_items: true
  # 是否开启自动出售功能
  auto_sell: true

# 自动出售相关设置
autosell:
  # 自动出售时是否发送提示消息
  send_message: true
  # 批量出售阈值，达到此数量才自动出售
  batch_threshold: 64

# 每日 EMC 获取限制
# 此功能限制玩家每天通过出售物品获得的 EMC 总量。
# 修改配置后使用 /alemcexchange reload 重载插件。
daily_limit:
  # true=启用每日限额，false=关闭每日限额
  enabled: false
  # 每日额度重置时间，使用服务器本地时间，格式必须为 HH:mm
  reset_time: "00:00"
  # 所有权限组都未匹配时的兜底额度；base 组也会用到
  default_limit: 10000

  # 权限前缀：实际权限节点格式为「permission_prefix.权限组名称」
  # 例如 vip 组对应 alemcexchange.daily.vip
  permission_prefix: "alemcexchange.daily"

  # 每日限额权限组，可按相同格式自由新增更多组，无需修改插件代码。
  # base：所有玩家自动使用的默认组，不需要授予 alemcexchange.daily.base 权限。
  # limit：该组每日最多可获得的 EMC；设置为 -1 表示无限制。
  # weight：权限优先级，数值越大越优先。
  # 当玩家同时拥有多个组权限时，只使用 weight 最高的组，不叠加额度。
  limit_groups:
    base:
      # 普通玩家每日上限
      limit: 10000
      # 默认组应保持最低权重
      weight: 0
    vip:
      # 需要权限 alemcexchange.daily.vip
      limit: 50000
      weight: 10
    premium:
      # 需要权限 alemcexchange.daily.premium
      limit: 100000
      weight: 20
    unlimited:
      # 需要权限 alemcexchange.daily.unlimited；-1 表示无限制
      limit: -1
      weight: 100

    # 新增权限组示例（删除前面的 # 即可启用）：
    # svip:
    #   limit: 200000  # 对应权限 alemcexchange.daily.svip
    #   weight: 30

# 权限说明
# alemcexchange.use - 基础使用权限（默认所有玩家拥有）
# alemcexchange.admin - 管理员权限，用于执行reload、give命令和解锁其他玩家的所有物品
# alemcexchange.autosell - 允许使用自动出售功能
# alemcexchange.notax - 无税率权限
# alemcexchange.vip - VIP权限，3%税率
# alemcexchange.premium - 高级用户权限，1%税率
# alemcexchange.unlockall.auto - 自动解锁所有物品（无需执行命令）
# alemcexchange.daily.vip - VIP每日限额权限
# alemcexchange.daily.premium - 高级用户每日限额权限
# alemcexchange.daily.unlimited - 无限每日限额权限
